px;margin-top:3px}.tag{border-radius:99px;padding:5px 10px;background:#e7f5ee;color:#23835a;font-size:13px;font-weight:750}.tag.off{background:#f3f3f5;color:#999}.tag.pending{background:#fff2e2;color:#995b23}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sep{height:1px;background:#eeeef1;margin:21px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:25px 0 10px}.tab{white-space:nowrap;border:0;border-radius:13px;padding:12px 18px;font-size:16px;font-weight:750;color:#757783;background:#eeeef1}.tab.selected{background:#b81025;color:white}.day{padding:12px 0;border-bottom:1px solid #eeeef2;display:flex;align-items:center;justify-content:space-between;gap:10px}.day:last-child{border:0}.overlay{position:fixed;inset:0;background:#12121d80;z-index:3;display:flex;justify-content:center;align-items:center;padding:12px}.modal{background:white;border-radius:24px;padding:25px;width:100%;max-width:540px;max-height:92dvh;overflow:auto}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#282932;color:white;border-radius:13px;padding:15px 22px;max-width:90vw}.warn{border-radius:12px;padding:13px 15px;font-size:15px;background:#fff2e7;color:#8e5424;margin:15px 0}.footer{font-size:14px;color:#999;margin-top:30px;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.employee{flex-wrap:wrap}.card{padding:20px}.top{margin-bottom:24px}}@media(max-width:375px){.grid{grid-template-columns:1fr}}

</style></head><body><main><header class="top"><div class="brand"><span class="logo">◷</span><span>CFI <span class="muted">admin</span></span></div><button id="logout" class="btn outline hidden">Sign out</button></header><div id="app"></div><div class="footer">CFI Time Clock · Administrator</div></main><div id="overlay" class="overlay hidden"></div><div id="toast" class="toast hidden"></div><script>
const $=x=>document.getElementById(x),safe=v=>String(v??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k])),fix=v=>Number(v).toFixed(2);
let state=null,week=null,tab='overview';
async function api(path,body){const r=await fetch('/api/admin/'+path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json().catch(()=>({error:'Connection unavailable'}));if(!r.ok)throw Error(data.error||'Request failed');return data}
function alertUser(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(alertUser.t);alertUser.t=setTimeout(()=>$('toast').classList.add('hidden'),3800)}
function pop(html){$('overlay').innerHTML='<div class="modal">'+html+'<div class="sep"></div><button id="cancel" class="btn outline">Close</button></div>';$('overlay').classList.remove('hidden');$('overlay').onclick=e=>{if(e.target===$('overlay'))hide()};$('cancel').onclick=hide}
function hide(){$('overlay').classList.add('hidden');$('overlay').innerHTML=''}
const displayDay=d=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00Z'));
const time=iso=>new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'}).format(new Date(iso));
const central=iso=>new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'America/Chicago'}).format(new Date(iso)).replace(' ','T');
function parseCentral(value){const t=Date.parse(value+':00Z');if(!Number.isFinite(t))return null;const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',timeZoneName:'shortOffset'}).formatToParts(new Date(t));const p=parts.find(x=>x.type==='timeZoneName')?.value||'GMT-6';const m=p.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);const offset=m?(m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3]||0)): -360;return new Date(t-offset*60000).toISOString()}
function login(configured){$('logout').classList.add('hidden');if(!configured){$('app').innerHTML='<section class="card narrow"><h1 class="title">Configure admin password</h1><p class="muted">Add a Worker secret named ADMIN_PASSWORD in Cloudflare Settings, at least 12 characters long.</p><button id="check" class="btn red">Check again</button></section>';$('check').onclick=start;return;}$('app').innerHTML='<section class="card narrow"><h1 class="title">Administrator sign in</h1><p class="muted">Enter the password saved in Cloudflare.</p><form id="auth"><label class="label">Admin password</label><input class="input" id="password" type="password" required><button class="btn red">Sign in</button></form></section>';$('auth').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});await refresh()}catch(err){alertUser(err.message)}}}
async function start(){try{const config=await api('config');try{await api('session');await refresh()}catch(e){login(config.configured)}}catch(e){$('app').innerHTML='<div class="card"><h2>Unable to connect</h2><p>'+safe(e.message)+'</p><button class="btn red" onclick="location.reload()">Try again</button></div>'}}
async function refresh(){state=await api('state'+(week?'?week='+week:''));week=state.week;render()}
function addWeek(delta){const d=new Date(week+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+7*delta);week=d.toISOString().slice(0,10);refresh().catch(e=>alertUser(e.message))}
function render(){$('logout').classList.remove('hidden');const employees=state.employees,worked=employees.reduce((s,e)=>s+e.totals.workedHours,0),pending=employees.reduce((s,e)=>s+e.requests.filter(r=>r.status==='PENDING').length,0);
$('app').innerHTML='<h1 class="title">Time clock overview</h1><p class="muted">Manage employee hours, time off, and payroll.</p><div class="card hrow"><button id="prev" class="btn outline">← Previous</button><div style="text-align:center"><b>'+displayDay(week)+' – '+displayDay(state.sunday)+'</b><div class="sub">Payroll week</div></div><button id="next" class="btn outline">Next →</button></div><div class="grid"><div class="card stats"><div class="muted small">Employees</div><div class="metric">'+employees.length+'</div></div><div class="card stats"><div class="muted small">Worked hours</div><div class="metric">'+fix(worked)+'</div></div><div class="card stats"><div class="muted small">PTO pending</div><div class="metric">'+pending+'</div></div></div><nav class="tabs">'+['overview','employees','pto'].map(t=>'<button class="tab '+(tab===t?'selected':'')+'" data-tab="'+t+'">'+({overview:'Timecards',employees:'Employees',pto:'PTO Requests'}[t])+'</button>').join('')+'</nav><section id="content"></section>';
$('prev').onclick=()=>addWeek(-1);$('next').onclick=()=>addWeek(1);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('logout').onclick=async()=>{await api('logout',{});state=null;week=null;login(true)};drawContent()}
function drawContent(){const c=$('content');if(tab==='employees'){c.innerHTML='<div class="card"><h2>Import employee roster</h2><p class="muted">Load all employees at once from the roster file. The other employees will stay disabled until you enable them.</p><label class="label" for="rosterfile">Employee roster file (.tsv)</label><input id="rosterfile" class="input" type="file" accept=".tsv,.txt,text/tab-separated-values"><button class="btn red" id="importroster">Import roster</button></div><div class="card"><h2>Add employee</h2><p class="muted">Employees sign in with their ID only. No employee directory appears on their devices.</p><form id="add"><label class="label">Paychex employee ID</label><input class="input" name="id" inputmode="numeric" autocomplete="off" required><label class="label">Employee name</label><input class="input" name="name" autocomplete="off" required><button class="btn red">Add employee</button></form></div><div class="card"><h2>Employee access</h2>'+state.employees.map(e=>'<div class="employee"><div><div class="name">'+safe(e.name)+'</div><div class="sub">ID '+safe(e.id)+'</div><div class="sub">Display: '+safe(e.preferredName||(e.name.includes(',')?e.name.split(',')[1].trim().split(/\s+/)[0]:e.name.split(/\s+/)[0]))+'</div></div><div class="row"><span class="tag '+(e.enabled?'':'off')+'">'+(e.enabled?'Active':'Disabled')+'</span><button class="btn outline" data-preferred="'+safe(e.id)+'">Preferred Name</button><button class="btn outline" data-toggle="'+safe(e.id)+'">'+(e.enabled?'Disable':'Enable')+'</button></div></div>').join('')+'</div>';c.querySelector('#importroster').onclick=async()=>{
 const file=c.querySelector('#rosterfile').files?.[0];
 if(!file){alertUser('Select the employee roster file first');return}
 try{
  const lines=(await file.text()).trim().split(/\r?\n/);
  if(lines.length<2)throw Error('Roster is empty');
  const entries=lines.slice(1).filter(Boolean).map(line=>{
   const fields=line.split('\t');
   if(fields.length<3)throw Error('Invalid roster file format');
   return {id:fields[0].trim(),name:fields[1].trim(),enabled:fields[2].trim()==='1'};
  });
  if(!confirm('Import '+entries.length+' employees? Only rows marked Enabled will be able to sign in.'))return;
  const res=await api('roster-import',{employees:entries});
  await refresh();
  alertUser('Imported '+res.added+' employees'+(res.existing?' · '+res.existing+' already existed':''));
 }catch(err){alertUser(err.message)}
};c.querySelector('#add').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target).entries());try{await api('employee',d);await refresh();alertUser('Employee added')}catch(e){alertUser(e.message)}};c.querySelectorAll('[data-preferred]').forEach(b=>b.onclick=()=>{
 const employee=state.employees.find(e=>e.id===b.dataset.preferred);
 if(employee)editPreferredName(employee);
});c.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const emp=state.employees.find(e=>e.id===b.dataset.toggle);if(!confirm((emp.enabled?'Disable ':'Enable ')+emp.name+'?'))return;try{await api('employee-status',{id:emp.id,enabled:!emp.enabled});await refresh()}catch(e){alertUser(e.message)}});return}
if(tab==='pto'){const requests=state.employees.flatMap(e=>e.requests.map(r=>({...r,employee:e.name})));c.innerHTML='<div class="card"><h2>PTO requests</h2>'+(requests.length?requests.map(r=>'<div class="employee"><div><div class="name">'+safe(r.employee)+'</div><div class="sub">'+displayDay(r.date)+' · '+fix(r.hours)+' hours</div></div><div class="row"><span class="tag '+(r.status==='PENDING'?'pending':r.status==='DENIED'?'off':'')+'">'+safe(r.status)+'</span>'+(r.status==='PENDING'?'<button class="btn red" data-decision="APPROVED" data-id="'+safe(r.id)+'">Approve</button><button class="btn outline" data-decision="DENIED" data-id="'+safe(r.id)+'">Deny</button>':'')+'</div></div>').join(''):'<p class="muted">No PTO requests for this week.</p>')+'</div>';c.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{try{await api('pto-review',{id:b.dataset.id,status:b.dataset.decision});await refresh();alertUser('PTO updated')}catch(e){alertUser(e.message)}});return}
c.innerHTML='<div class="card"><div class="hrow"><div><h2>Weekly timecards</h2><p class="muted">Review exact punches and weekly rounded hours.</p></div><button id="export" class="btn red">Export CSV</button></div>'+(state.employees.length?state.employees.map(e=>'<div class="employee"><div><div class="name">'+safe(e.name)+'</div><div class="sub">Regular '+fix(e.totals.regularHours)+' · Overtime '+fix(e.totals.overtimeHours)+' · PTO '+fix(e.approvedPto)+(e.totals.warnings.length?' · Needs review':'')+'</div></div><div class="row"><span class="tag '+(e.totals.warnings.length?'pending':'')+'">'+fix(e.totals.workedHours)+' hrs</span><button class="btn outline" data-view="'+safe(e.id)+'">View</button></div></div>').join(''):'<p class="muted">No employees yet. Open Employees to add your first account.</p>')+'</div>';c.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showCard(state.employees.find(e=>e.id===b.dataset.view)));$('export').onclick=async()=>{try{const r=await fetch('/api/admin/export?week='+week,{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('Export unavailable');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='cfi-payroll-'+week+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){alertUser(e.message)}}}
function editPreferredName(employee){
 pop('<h2>Preferred Name</h2><p class="muted">Employee: '+safe(employee.name)+'</p><p class="muted">Use the name this employee prefers to see when signing in and clocking in. Their Paychex name remains unchanged for payroll.</p><form id="preferredForm"><label class="label" for="preferredInput">Preferred Name</label><input class="input" id="preferredInput" type="text" maxlength="60" autocomplete="off" placeholder="Example: Mike"><button class="btn red" type="submit">Save Preferred Name</button></form><div class="info">Leave this field blank to use the first name from Paychex.</div>');
 $('preferredInput').value=employee.preferredName||'';
 $('preferredForm').onsubmit=async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;
  try{
   await api('preferred-name',{id:employee.id,preferredName:$('preferredInput').value});
   hide();await refresh();alertUser('Preferred Name Saved');
  }catch(err){alertUser(err.message);button.disabled=false;}
 };
}
function showCard(e){
 const info='<h2>'+safe(e.name)+'</h2><p class="muted">Week of '+displayDay(week)+' · Regular '+fix(e.totals.regularHours)+' · Overtime '+fix(e.totals.overtimeHours)+'</p>';
 const dates=e.totals.days.map(d=>'<h3 style="margin:23px 0 8px">'+displayDay(d.date)+' · '+fix(d.minutes/60)+' hours</h3>'
 +d.punches.map(p=>'<div class="day"><span>'+(p.kind==='IN'?'Clock In':'Clock Out')+' · '+time(p.at)+'</span><div class="row"><button class="btn outline" data-edit="'+safe(p.id)+'">Edit</button><button class="btn outline" style="color:#b81025" data-delete="'+safe(p.id)+'">Delete</button></div></div>').join('')
 +(d.lunchCredit?'<div class="sub">30-minute lunch credit included</div>':'')).join('');
 pop(info+(e.totals.warnings.length?'<div class="warn"><strong>Needs Review Before Payroll</strong><div style="margin-top:8px">'+e.totals.days.filter(d=>d.issues?.length).map(d=>'<div style="margin-top:6px">'+displayDay(d.date)+': '+d.issues.map(safe).join(' ')+'</div>').join('')+'</div>':'')
 +'<button class="btn red" id="quickPunch" style="width:100%;margin:8px 0">Quick Punch Entry</button><button class="btn outline" id="addPunch" style="width:100%;margin:0 0 15px">+ Add Missed Punch</button>'
 +dates+'<div class="info">Adding, editing, or deleting punches changes recorded time. Each change is retained in the administrator audit log. PTO and other employees are not affected.</div>');
 $('addPunch').onclick=()=>addPunch(e);
 $('quickPunch').onclick=()=>quickPunchEntry(e);
 $('overlay').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(e,b.dataset.edit));
 $('overlay').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePunch(e,b.dataset.delete));
}

function quickPunchEntry(employee){
 const options=employee.totals.days.map(d=>'<option value="'+safe(d.date)+'">'+displayDay(d.date)+'</option>').join('');
 pop('<h2>Quick Punch Entry</h2><p class="muted">'+safe(employee.name)+' · Week of '+displayDay(week)+'</p>'
  +'<label for="quickDay" class="label">Workday</label><select class="input" id="quickDay">'+options+'</select>'
  +'<p class="muted">Type IN time, Tab for OUT, Tab for the next IN. Times can be 7:30 AM or 15:30.</p>'
  +'<form id="quickForm"><div id="quickRows"></div><div class="quick-toolbar"><button type="button" id="quickAdd" class="btn outline">+ Line</button><button type="button" id="quickRemove" class="btn outline">Remove Last</button></div>'
  +'<p id="quickError" class="quick-error hidden" role="alert"></p><button class="btn red" id="quickSave" style="width:100%;margin-top:15px" type="submit">Save Punches</button></form>');
 $('quickDay').value=state.today>=week&&state.today<=state.sunday?state.today:week;
 const rows=$('quickRows');
 function addLine(focus=true){
  const i=rows.children.length;if(i>=40){alertUser('Maximum 40 punches');return}
  const kind=i%2?'OUT':'IN';
  const line=document.createElement('div');line.className='quick-line';
  line.innerHTML='<span class="quick-kind '+(kind==='IN'?'quick-in':'quick-out')+'">'+kind+'</span><input class="input quick-time" type="text" placeholder="8:00 AM" autocomplete="off" spellcheck="false" aria-label="'+kind+' time line '+(i+1)+'">';
  rows.appendChild(line);
  const input=line.querySelector('input');
  input.addEventListener('keydown',event=>{
   if(event.key==='Tab'&&!event.shiftKey&&line===rows.lastElementChild&&input.value.trim()){
    event.preventDefault();addLine();
   }
   if(event.key==='Enter'&&input.value.trim()){event.preventDefault();if(line===rows.lastElementChild)addLine();else line.nextElementSibling?.querySelector('input')?.focus()}
  });
  if(focus)input.focus();
 }
 addLine(false);
 $('quickAdd').onclick=()=>addLine();
 $('quickRemove').onclick=()=>{if(rows.children.length>1){rows.lastElementChild.remove();rows.lastElementChild.querySelector('input').focus()}};
 function parseTime(value){
  const raw=value.trim().toLowerCase().replace(/\./g,'').replace(/\s+/g,'');
  const m=raw.match(/^(\d{1,2})(?::?(\d{2}))?(am|pm|a|p)?$/);
  if(!m)return null;
  let h=Number(m[1]),minute=Number(m[2]||0);if(minute>59)return null;
  if(m[3]){if(h<1||h>12)return null;h=h%12+(m[3].startsWith('p')?12:0)}
  else if(h>23)return null;
  return String(h).padStart(2,'0')+':'+String(minute).padStart(2,'0');
 }
 $('quickForm').onsubmit=async event=>{
  event.preventDefault();
  const error=$('quickError');
  const fail=(message,input)=>{error.textContent=message;error.classList.remove('hidden');input?.focus()};
  const inputs=[...rows.querySelectorAll('input')];
  while(inputs.length&&!inputs[inputs.length-1].value.trim())inputs.pop();
  if(!inputs.length||inputs.length%2){fail('Complete each IN / OUT pair before saving.');return}
  const date=$('quickDay').value,punches=[];let last=0;
  for(let i=0;i<inputs.length;i++){
   const timeText=parseTime(inputs[i].value);
   if(!timeText){fail('Check the time on line '+(i+1)+'.',inputs[i]);return}
   const at=parseCentral(date+'T'+timeText);
   const millis=Date.parse(at);
   if(!at||!Number.isFinite(millis)||millis<=last){fail('Times must be in order. Check line '+(i+1)+'.',inputs[i]);return}
   last=millis;punches.push({kind:i%2?'OUT':'IN',at});
  }
  const prior=employee.punches.filter(p=>central(p.at).slice(0,10)===date);
  if(prior.length&&!confirm('This day already has '+prior.length+' punches. Add these without replacing the originals?'))return;
  if(!confirm('Save '+punches.length+' punches for '+employee.name+' on '+displayDay(date)+'?'))return;
  const button=$('quickSave');button.disabled=true;button.textContent='Saving…';
  try{
   const result=await api('punch-batch',{employeeId:employee.id,date,punches});
   hide();await refresh();alertUser(result.added+' punches saved');
  }catch(e){fail(e.message);button.disabled=false;button.textContent='Save Punches'}
 };
}
function addPunch(employee){
 pop('<h2>Add Missed Punch</h2><p class="muted">'+safe(employee.name)+' · Week of '+displayDay(week)+'</p><form id="addPunchForm"><label class="label" for="punchKind">Punch Type</label><select class="input" id="punchKind"><option value="IN">Clock In</option><option value="OUT">Clock Out</option></select><label class="label" for="punchAt">Date And Time (Central)</label><input class="input" type="datetime-local" id="punchAt" required><button class="btn red" type="submit">Add Punch</button></form><div class="info">This records an administrator-added punch. Original punch times are never silently modified.</div>');
 $('punchAt').value=(state.today>=week&&state.today<=state.sunday?state.today:week)+'T08:00';
 $('addPunchForm').onsubmit=async ev=>{
  ev.preventDefault();
  const button=ev.currentTarget.querySelector('button');button.disabled=true;
  try{
   const at=parseCentral($('punchAt').value);
   if(!at)throw Error('Enter a valid date and time');
   const dayValue=$('punchAt').value.slice(0,10);
   if(dayValue<week||dayValue>state.sunday)throw Error('Choose a date in the displayed payroll week');
   if(!confirm('Add this '+($('punchKind').value==='IN'?'Clock In':'Clock Out')+' punch on '+dayValue+'?')){button.disabled=false;return}
   await api('punch-add',{employeeId:employee.id,kind:$('punchKind').value,at});
   hide();await refresh();alertUser('Missed Punch Added');
  }catch(err){alertUser(err.message);button.disabled=false}
 };
}
function deletePunch(employee,punchId){
 const p=employee.punches.find(x=>x.id===punchId);
 if(!p)return;
 pop('<h2>Delete One Punch</h2><p class="muted">'+safe(employee.name)+'</p><div class="warn">You are deleting only this '+(p.kind==='IN'?'Clock In':'Clock Out')+' punch at '+time(p.at)+' on '+displayDay(central(p.at).slice(0,10))+'. This may leave an incomplete timecard until another correction is made. The original punch is preserved in the administrator audit log.</div><form id="deleteForm"><label class="label" for="deleteConfirmation">Type DELETE To Confirm</label><input class="input" id="deleteConfirmation" autocomplete="off" spellcheck="false" placeholder="DELETE" required><button class="btn red" type="submit" id="confirmDelete" disabled style="width:100%">Delete This Punch</button></form>');
 const input=$('deleteConfirmation'),button=$('confirmDelete');
 input.oninput=()=>{button.disabled=input.value!=='DELETE'};
 $('deleteForm').onsubmit=async ev=>{
  ev.preventDefault();
  if(input.value!=='DELETE')return;
  button.disabled=true;
  try{
   await api('punch-delete',{id:punchId,confirmation:input.value});
   hide();await refresh();alertUser('Punch Deleted');
  }catch(err){alertUser(err.message);button.disabled=false}
 };
}
function edit(e,id){
 const p=e.punches.find(x=>x.id===id);
 if(!p)return;
 pop('<h2>Edit Punch</h2><p class="muted">'+safe(e.name)+'</p>'
  +'<form id="correction">'
  +'<label class="label" for="editKind">Punch Type</label>'
  +'<select class="input" id="editKind"><option value="IN" '+(p.kind==='IN'?'selected':'')+'>Clock In</option><option value="OUT" '+(p.kind==='OUT'?'selected':'')+'>Clock Out</option></select>'
  +'<label class="label" for="when">Date And Time (Central)</label>'
  +'<input class="input" type="datetime-local" id="when" value="'+central(p.at)+'" required>'
  +'<button class="btn red" id="saveCorrection" type="submit">Save Changes</button></form>'
  +'<div class="info">You can correct the punch type, time, or both. Unmatched punches will be flagged for review, and the original values will remain in the audit log.</div>');
 $('correction').onsubmit=async ev=>{
  ev.preventDefault();
  const button=$('saveCorrection');
  const kind=$('editKind').value;
  const newTime=$('when').value;
  const at=parseCentral(newTime);
  if(!at){alertUser('Enter a valid date and time');return;}
  const original=p.kind==='IN'?'Clock In':'Clock Out';
  const updated=kind==='IN'?'Clock In':'Clock Out';
  if(!confirm('Save changes to this punch?\nOriginal: '+original+' · '+time(p.at)+'\nUpdated: '+updated+' · '+newTime.replace('T',' ')) )return;
  button.disabled=true;
  try{
   await api('punch-edit',{id,kind,at});
   hide();
   await refresh();
   alertUser('Punch Updated');
  }catch(err){alertUser(err.message);button.disabled=false;}
 };
}
start();
</script></body></html>
