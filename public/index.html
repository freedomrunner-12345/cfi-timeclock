<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b81025"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CFI Time">
<meta name="description" content="Simple, secure time clock for CFI Tire Service">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg">
<title>CFI Time Clock</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:#18191e;background:#f6f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:default} .hidden{display:none!important}
.shell{max-width:540px;margin:auto;min-height:100dvh;padding:0 20px max(32px,env(safe-area-inset-bottom));}.top{padding:calc(34px + env(safe-area-inset-top)) 0 32px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{background:#b81025;width:45px;height:45px;border-radius:15px;display:grid;place-items:center;box-shadow:0 6px 16px #b810252e;color:white}.brandname{font-weight:800;letter-spacing:-.04em;font-size:21px}.branddetail{font-size:12px;color:#898a94;margin-top:1px;font-weight:500}.tinybtn{width:40px;height:40px;border:none;background:white;border-radius:15px;color:#747782;font-size:23px;display:grid;place-items:center}
.eyebrow{font-size:12px;font-weight:760;letter-spacing:.09em;text-transform:uppercase;color:#9698a2}.greeting{font-size:32px;letter-spacing:-.065em;line-height:1.12;font-weight:760;margin:10px 0 10px}.sub{font-size:14px;color:#81838d;margin:0}.card{background:#fff;border:1px solid #eeeef0;border-radius:25px;box-shadow:0 4px 25px #20203006}.punchcard{margin-top:29px;padding:28px 24px 24px;text-align:center}.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:50px;background:#e9f7f0;color:#19845c;font-size:11px;font-weight:800;letter-spacing:.055em}.pill.out{background:#f4f4f6;color:#7e8089}.dot{width:7px;height:7px;border-radius:99px;background:currentColor}.timer{font-size:clamp(46px,11vw,65px);font-weight:730;letter-spacing:-.08em;font-variant-numeric:tabular-nums;line-height:1.1;margin:23px 0 6px}.timehint{color:#898b93;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:25px}.action{border:0;border-radius:18px;padding:21px 8px;display:flex;flex-direction:column;align-items:center;gap:9px;background:#f2f2f5;color:#5b5c65;font-weight:700;font-size:15px}.action.active{background:#bb1027;color:white;box-shadow:0 8px 18px #bb102725}.action svg{width:25px;height:25px}.sectiontitle{font-size:18px;letter-spacing:-.04em;font-weight:750;margin:31px 0 14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stat{padding:19px}.stat-label{font-size:12px;font-weight:600;color:#8b8c95}.stat-value{font-size:29px;letter-spacing:-.065em;font-weight:750;margin-top:7px;font-variant-numeric:tabular-nums}.stat-suffix{font-size:12px;color:#858791;font-weight:500;margin-left:4px}.linkrow{border:none;background:white;padding:17px 19px;width:100%;text-align:left;display:flex;align-items:center;gap:13px;color:#292a30}.linkrow:first-child{border-radius:25px 25px 0 0}.linkrow:last-child{border-radius:0 0 25px 25px}.linkrow+ .linkrow{border-top:1px solid #f0f0f3}.linkicon{width:41px;height:41px;border-radius:14px;background:#fff0f2;color:#c51b31;display:grid;place-items:center}.linkicon svg{width:20px;height:20px}.linkrow strong{font-size:14px}.linkrow small{display:block;margin-top:4px;color:#93949b;font-size:12px}.chev{margin-left:auto;color:#adb0b9}.foot{text-align:center;padding:30px 0 0;font-size:11px;color:#a2a4ab}
.auth{margin-top:20px;padding:28px 24px}.auth h2,.modal h2{font-size:25px;letter-spacing:-.05em;margin:0 0 8px}.auth p,.modal p{font-size:14px;line-height:1.5;color:#83858e;margin:0 0 24px}.field{display:block;font-size:12px;font-weight:750;color:#555965;margin:0 0 7px}.input{appearance:none;border:1px solid #e5e5e9;background:#fbfbfc;width:100%;padding:15px 14px;border-radius:13px;outline:none;font-size:16px;margin:0 0 16px;color:#23242b}.input:focus{border-color:#c32139;box-shadow:0 0 0 3px #c3213910}.primary{border:none;background:#b81025;color:white;font-weight:750;font-size:15px;padding:16px;border-radius:15px;width:100%;min-height:52px}.secondary{border:1px solid #e9e9ec;background:white;color:#393b45;font-weight:700;font-size:14px;padding:12px 15px;border-radius:13px}.hint{font-size:12px;color:#999ba4;margin-top:8px;line-height:1.6}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#292a30;color:white;border-radius:13px;padding:13px 18px;max-width:calc(100vw - 40px);box-shadow:0 9px 35px #0003;font-size:13px;font-weight:600;z-index:40;text-align:center}.toast.error{background:#a90e24}
.overlay{position:fixed;inset:0;background:#12121c80;display:flex;justify-content:center;align-items:flex-end;z-index:20;padding:16px 12px max(16px,env(safe-area-inset-bottom))}.modal{background:white;width:100%;max-width:510px;max-height:90dvh;overflow:auto;border-radius:27px;padding:26px 23px;box-shadow:0 20px 80px #10101940}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.close{border:0;background:#f4f4f6;color:#777;font-size:22px;border-radius:12px;width:35px;height:35px}.date-row,.punch-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #f0f0f2;font-size:13px}.date-row:last-child,.punch-row:last-child{border:0}.date-row b{font-variant-numeric:tabular-nums}.muted{font-size:12px;color:#8c8e97}.warning{background:#fff3e8;color:#925418;border-radius:13px;padding:12px 14px;font-size:12px;margin:12px 0;line-height:1.5}.notice{background:#f7f7f9;color:#777983;border-radius:13px;padding:12px 14px;font-size:12px;margin:12px 0;line-height:1.5}.secondary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rowbuttons{display:flex;gap:8px;align-items:center}.minibtn{border:0;border-radius:9px;padding:7px 9px;background:#f3f3f6;color:#666;font-size:11px;font-weight:750}.minibtn.red{background:#fff0f2;color:#b81025}.divider{height:1px;background:#f0f0f2;margin:19px 0}.title-small{font-size:14px;font-weight:750;margin:20px 0 6px}.spinner{height:16px;width:16px;border:2px solid #ddd;border-top-color:#bd1229;border-radius:100%;display:inline-block;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:700px){.shell{padding:0 24px 48px}.overlay{align-items:center}.top{padding-top:35px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><path d="M16 9v8l5 3"/></svg></div><div><div class="brandname">CFI <span style="font-weight:500;color:#7c7e89">time</span></div><div class="branddetail">TIRE SERVICE</div></div></div><button id="settings" class="tinybtn hidden" aria-label="Account settings">⋯</button></header><div id="app"></div><footer class="foot">CFI Tire Service · Secure time tracking</footer></main><div id="overlay" class="overlay hidden"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const icons = {
in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m-4 4 4-4 4 4"/><path d="M4 8V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/></svg>',
calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg>',
list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
};
const escapeHTML = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date(iso));
const fmtDay = day => new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(day+'T12:00:00Z'));
const n2 = n => Number(n).toFixed(2);
let state = null, working = false, ticker;
function flash(message, isError=false) {const t=$('toast'); t.textContent=message;t.className='toast'+(isError?' error':'');clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.add('hidden'),3600)}
async function api(path, body, method) {
const res=await fetch('/api/'+path,{method:method||(body===undefined?'GET':'POST'),headers:body===undefined?{}:{'Content-Type':'application/json'},credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
const data=await res.json().catch(()=>({error:'Connection error'}));if(!res.ok)throw new Error(data.error||'Request failed');return data;
}
function authScreen(setup) {
$('settings').classList.add('hidden');state=null;clearInterval(ticker);
$('app').innerHTML='<div class="eyebrow">'+(setup?'FIRST-TIME SETUP':'WELCOME BACK')+'</div><h1 class="greeting">'+(setup?'Your time clock.':'Ready when you are.')+'</h1><p class="sub">'+(setup?'Set up the private CFI pilot account.':'Sign in to clock in or out.')+'</p><div class="card auth"><h2>'+(setup?'Create your account':'Sign in')+'</h2><p>'+(setup?'This pilot is limited to Paychex ID 194.':'Your employee ID and PIN keep your punches private.')+'</p><form id="authform">'+(setup?'<label class="field" for="setupCode">Cloudflare setup code</label><input class="input" name="setupCode" id="setupCode" type="password" autocomplete="off" placeholder="Private setup secret" required><label class="field" for="name">Your name</label><input class="input" name="name" id="name" autocomplete="name" value="Travis Nunn" required>':'')+'<label class="field" for="id">Paychex employee ID</label><input class="input" id="id" name="id" type="text" inputmode="numeric" autocomplete="username" value="'+(setup?'194':'')+'" required><label class="field" for="pin">Your 6–8 digit PIN</label><input class="input" id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="'+(setup?'new-password':'current-password')+'" required><button class="primary" type="submit">'+(setup?'Create secure account':'Sign in')+'</button></form><div class="hint">'+(setup?'The setup code is the BOOTSTRAP_SECRET configured in your Cloudflare Worker, not your Paychex ID.':'You will stay signed in on this device unless you sign out.')+'</div></div>';
$('authform').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Please wait…';try{const o=Object.fromEntries(new FormData(f).entries());await api(setup?'setup':'login',o);await load();}catch(err){flash(err.message,true);btn.disabled=false;btn.textContent=setup?'Create secure account':'Sign in';}};
}
async function start(){try{const cfg=await api('config');if(cfg.setupRequired){authScreen(true);return;}await load();}catch(e){$('app').innerHTML='<div class="card auth"><h2>Connection unavailable</h2><p>'+escapeHTML(e.message)+'</p><button class="primary" onclick="location.reload()">Try again</button></div>';}}
async function load(){try{state=await api('state');render();}catch(e){if(/sign in/i.test(e.message)){authScreen(false);}else flash(e.message,true);}}
function timer(){const el=$('elapsed');if(!el||!state)return;let seconds=0;if(state.isClockedIn&&state.lastPunch){seconds=Math.max(0,Math.floor((Date.now()-new Date(state.lastPunch.at).getTime())/1000));}const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;el.textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function render(){clearInterval(ticker);$('settings').classList.remove('hidden');const s=state,first=s.user.name.trim().split(/\s+/)[0],on=s.isClockedIn,week=s.totals,warning=week.warnings.length;
$('app').innerHTML='<div class="eyebrow">'+escapeHTML(fmtDay(s.today))+'</div><h1 class="greeting">Welcome back, '+escapeHTML(first)+'.</h1><p class="sub">One less thing to think about today.</p><div class="card punchcard"><div class="pill '+(on?'':'out')+'"><span class="dot"></span>'+(on?'CURRENTLY CLOCKED IN':'CURRENTLY CLOCKED OUT')+'</div><div id="elapsed" class="timer">00:00:00</div><div class="timehint">'+(s.lastPunch?(on?'Clocked in at ':'Last clocked out at ')+escapeHTML(fmt(s.lastPunch.at)):'Ready for your first punch')+'</div><div class="actions"><button class="action '+(!on?'active':'')+'" id="clockin" '+(on?'disabled':'')+'>'+icons.in+'<span>Clock In</span></button><button class="action '+(on?'active':'')+'" id="clockout" '+(!on?'disabled':'')+'>'+icons.out+'<span>Clock Out</span></button></div></div><h2 class="sectiontitle">This week</h2><div class="stats"><div class="card stat"><div class="stat-label">Worked hours</div><div class="stat-value">'+n2(week.workedHours)+'<span class="stat-suffix">hrs</span></div></div><div class="card stat"><div class="stat-label">Approved PTO</div><div class="stat-value">'+n2(s.ptoHours)+'<span class="stat-suffix">hrs</span></div></div></div>'+(warning?'<div class="warning">Some punches are incomplete or need review. Check your timecard before payroll.</div>':'')+'<h2 class="sectiontitle">Quick actions</h2><div class="card"><button class="linkrow" id="pto"><span class="linkicon">'+icons.calendar+'</span><span><strong>Request time off</strong><small>For the current payroll week</small></span><span class="chev">›</span></button><button class="linkrow" id="hours"><span class="linkicon">'+icons.list+'</span><span><strong>View my timecard</strong><small>Daily punches, hours & payroll review</small></span><span class="chev">›</span></button></div>';
$('clockin').onclick=()=>punch('IN');$('clockout').onclick=()=>punch('OUT');$('pto').onclick=pto; $('hours').onclick=hours; $('settings').onclick=account;timer();ticker=setInterval(timer,1000);
}
async function punch(kind){if(working)return;working=true;const el=$(kind==='IN'?'clockin':'clockout');el.disabled=true;try{await api('punch',{kind});await load();flash(kind==='IN'?'Clocked in successfully':'Clocked out successfully');}catch(e){flash(e.message,true);el.disabled=false;}finally{working=false;}}
function modal(content){$('overlay').innerHTML='<div class="modal" role="dialog" aria-modal="true">'+content+'</div>';$('overlay').classList.remove('hidden');$('overlay').onclick=e=>{if(e.target===$('overlay'))dismiss()};const close=$('closemodal');if(close)close.onclick=dismiss;}
function dismiss(){$('overlay').classList.add('hidden');$('overlay').innerHTML='';}
function modalHeading(title,subtitle){return '<div class="modalhead"><div><h2>'+title+'</h2><p style="margin:3px 0 0">'+subtitle+'</p></div><button class="close" id="closemodal" aria-label="Close">×</button></div>';}
function pto(){const s=state;modal(modalHeading('Request time off','Choose a day in the current pay period.')+'<form id="ptoform"><label class="field" for="ptodate">Date</label><input id="ptodate" class="input" type="date" name="date" min="'+s.monday+'" max="'+s.sunday+'" value="'+s.today+'" required><label class="field" for="ptohours">Hours requested</label><select class="input" name="hours" id="ptohours">'+Array.from({length:48},(_,i)=>{const n=(i+1)/4;return '<option value="'+n+'" '+(n===8?'selected':'')+'>'+n.toFixed(2)+' hours</option>'}).join('')+'</select><button class="primary" type="submit">Submit PTO request</button></form><div class="notice">Requests stay pending until reviewed. PTO is separate from hours worked and does not count toward overtime.</div>'+(s.requests.length?'<div class="title-small">Requests this week</div>'+s.requests.map(r=>'<div class="date-row"><span>'+fmtDay(r.date)+' · '+n2(r.hours)+' hrs</span><b>'+escapeHTML(r.status.toLowerCase())+'</b></div>').join(''):''));
$('ptoform').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const btn=f.querySelector('button');btn.disabled=true;try{await api('pto',Object.fromEntries(new FormData(f).entries()));dismiss();await load();flash('PTO request submitted');}catch(err){flash(err.message,true);btn.disabled=false;}};}
function hours(){const s=state,t=s.totals;modal(modalHeading('Your timecard',fmtDay(s.monday)+' – '+fmtDay(s.sunday))+'<div class="secondary-grid"><div class="card stat"><div class="stat-label">Regular</div><div class="stat-value">'+n2(t.regularHours)+'</div></div><div class="card stat"><div class="stat-label">Overtime</div><div class="stat-value">'+n2(t.overtimeHours)+'</div></div></div><div class="notice">Exact punch times are saved. Worked hours are rounded once at the weekly total to the nearest 0.25 hour. The first completed break each day receives a 30-minute paid lunch credit. Review unusual breaks and shifts before payroll.</div>'+(t.days.map(day=>'<div><div class="date-row"><div><strong>'+fmtDay(day.date)+'</strong>'+(day.needsReview?'<span style="color:#ac651d;font-size:11px"> · Needs review</span>':'')+'</div><b>'+n2(day.minutes/60)+' hrs</b></div>'+day.punches.map(p=>'<div class="punch-row"><span class="muted">'+(p.kind==='IN'?'Clock in':'Clock out')+' · '+fmt(p.at)+(p.corrected_at?' · corrected':'')+'</span><button class="minibtn" data-edit="'+p.id+'">Edit</button></div>').join('')+(day.lunchCredit?'<div class="muted" style="padding:6px 0">30-minute paid lunch credit applied</div>':'')+'</div>').join(''))+'<div class="divider"></div><div class="title-small">PTO approvals</div>'+(s.requests.length?s.requests.map(r=>'<div class="date-row"><div><strong>'+fmtDay(r.date)+'</strong><div class="muted">'+n2(r.hours)+' hrs · '+r.status+'</div></div>'+(r.status==='PENDING'?'<span class="rowbuttons"><button class="minibtn" data-pto="'+r.id+'" data-status="APPROVED">Approve</button><button class="minibtn red" data-pto="'+r.id+'" data-status="DENIED">Deny</button></span>':'')+'</div>').join(''):'<p class="muted">No requests this week.</p>')+'<div class="divider"></div><button id="export" class="primary">Export payroll CSV</button><div class="hint">Pilot account administrator access · punches corrected here are logged for audit.</div>');
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPunch(b.dataset.edit));
document.querySelectorAll('[data-pto]').forEach(b=>b.onclick=async()=>{if(!confirm('Mark this PTO request '+b.dataset.status.toLowerCase()+'?'))return;try{await api('pto-review',{id:b.dataset.pto,status:b.dataset.status});dismiss();await load();hours();flash('PTO updated');}catch(e){flash(e.message,true);}});
$('export').onclick=async()=>{try{const response=await fetch('/api/export',{credentials:'same-origin'});if(!response.ok)throw new Error('Export unavailable');const blob=await response.blob();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cfi-timeclock-'+s.monday+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}catch(e){flash(e.message,true);}};
}
function editPunch(id){const p=state.punches.find(p=>p.id===id);if(!p)return;const dt=new Date(p.at), formatter=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});const dateValue=formatter.format(dt).replace(' ','T');modal(modalHeading('Correct a punch',p.kind==='IN'?'Clock in':'Clock out')+'<form id="editform"><label class="field">Time (Central)</label><input class="input" id="edittime" name="at" type="datetime-local" value="'+dateValue+'" required><button class="primary" type="submit">Save correction</button></form><div class="warning">Changes are recorded in the audit log. Correct only verified time entries. You cannot change the original workday in this release.</div>');$('editform').onsubmit=async e=>{e.preventDefault();const v=$('edittime').value;if(!v)return;const parsed=new Date(v);if(!confirm('Update this punch to '+parsed.toLocaleString()+'?'))return;try{await api('punch-edit',{id,at:parsed.toISOString()});dismiss();await load();hours();flash('Punch corrected');}catch(err){flash(err.message,true);}};}
function account(){modal(modalHeading('Account','Paychex ID '+escapeHTML(state.user.id))+'<div class="notice">Signed in as '+escapeHTML(state.user.name)+'. Your phone remembers you for 30 days. Clock actions require an internet connection.</div><button class="primary" id="signout">Sign out of this device</button>');$('signout').onclick=async()=>{try{await api('logout',{});dismiss();authScreen(false);flash('Signed out');}catch(e){flash(e.message,true);}};}
window.addEventListener('online',()=>flash('Back online'));window.addEventListener('offline',()=>flash('You are offline. Punches cannot be saved until reconnected.',true));
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
start();
</script></body></html>
