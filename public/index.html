<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b81025"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CFI Time"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>CFI Time Clock</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f9;color:#202127;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}main{max-width:540px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;letter-spacing:-.06em;font-weight:800}.logo{background:#b81025;color:white;border-radius:14px;width:46px;height:46px;display:grid;place-items:center;font-size:26px}.grey{color:#9798a2}.eyebrow{font-size:15px;font-weight:800;letter-spacing:.06em;color:#878893}.hello{font-size:33px;letter-spacing:-.06em;margin:10px 0}.sub{font-size:17px;color:#767883;line-height:1.5}.card{background:#fff;border:1px solid #eeeef1;border-radius:24px;padding:22px;box-shadow:0 8px 25px #22222205;margin-top:23px}.punch{text-align:center;padding:28px 22px 22px}.pill{display:inline-block;font-size:14px;border-radius:20px;padding:9px 14px;background:#e9f7f0;color:#238259;font-weight:800}.pill.off{background:#f1f1f4;color:#7c7e87}.clock{font-size:54px;letter-spacing:-.08em;font-weight:750;font-variant-numeric:tabular-nums;margin:22px 0 3px}.actions,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}button{font:inherit;cursor:pointer}button:disabled{opacity:.35}.action{border:0;border-radius:16px;padding:24px 9px;font-weight:750;font-size:19px;background:#f0f0f3;color:#696974}.action.active,.primary{color:white;background:#b81025}.primary{border:0;border-radius:14px;padding:18px;width:100%;font-weight:750;font-size:18px}.stat{padding:20px}.label{color:#767882;font-size:16px}.value{font-size:30px;font-weight:750;letter-spacing:-.05em;margin-top:8px}.section{font-size:18px;letter-spacing:-.04em;margin:28px 0 12px}.link{border:0;width:100%;padding:21px;background:white;text-align:left;font-weight:700;font-size:18px;color:#2c2c32}.link+.link{border-top:1px solid #f0f0f2}.link small{display:block;color:#858792;font-size:15px;font-weight:400;margin-top:5px}.input{width:100%;margin:8px 0 18px;padding:16px;border-radius:14px;background:#fafafa;border:1px solid #e5e5e8;font:inherit;font-size:18px}.field{font-size:16px;font-weight:750;color:#666}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:3;background:#15151c88;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:white;border-radius:25px;padding:24px;width:100%;max-width:500px;max-height:89vh;overflow:auto}.row{padding:15px 0;border-bottom:1px solid #ededf0;display:flex;justify-content:space-between;gap:16px;font-size:16px}.muted{font-size:15px;color:#858691}.info{background:#f7f7f8;color:#747680;padding:14px;border-radius:12px;margin:16px 0;font-size:15px;line-height:1.5}.close{float:right;border:0;background:#f1f1f4;border-radius:10px;padding:8px 12px;color:#666}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2b34;color:white;padding:14px;border-radius:12px;font-size:16px;max-width:90vw}@media(min-width:700px){.overlay{align-items:center}}
</style></head><body><main><header class="top"><div class="brand"><span class="logo">◷</span><span>CFI <span class="grey">time</span></span></div><button id="signout" class="close hidden">Sign out</button></header><div id="app"></div></main><div class="overlay hidden" id="overlay"></div><div class="toast hidden" id="toast"></div><script>
const $=s=>document.getElementById(s),escapeHTML=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fixed=n=>Number(n).toFixed(2),fmt=t=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date(t)),day=d=>new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
let state=null,interval=null;
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',credentials:'same-origin',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function modal(s){$('overlay').innerHTML='<div class="modal"><button id="close" class="close">×</button>'+s+'</div>';$('overlay').classList.remove('hidden');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()}}
function close(){$('overlay').classList.add('hidden')}
function signin(){clearInterval(interval);state=null;$('signout').classList.add('hidden');$('app').innerHTML='<div class="eyebrow">WELCOME BACK</div><h1 class="hello">Ready when you are.</h1><p class="sub">Enter your employee ID to continue.</p><div class="card"><h2>Sign in</h2><form id="login"><label class="field">Paychex employee ID</label><input class="input" name="id" id="id" inputmode="numeric" required placeholder="Enter your ID"><button class="primary">Continue</button></form><p class="muted">Your device will remember you after signing in.</p></div>';$('login').onsubmit=async e=>{e.preventDefault();try{await api('login',{id:$('id').value});await load()}catch(e){toast(e.message)}}}
function elapsed(){if(!state)return;const s=state.isClockedIn?Math.max(0,Math.floor((Date.now()-new Date(state.lastPunch.at).getTime())/1000)):0;$('timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function render(){clearInterval(interval);$('signout').classList.remove('hidden');const s=state,on=s.isClockedIn;$('app').innerHTML='<div class="eyebrow">'+day(s.today).toUpperCase()+'</div><h1 class="hello">Welcome back, '+escapeHTML(s.user.name.split(' ')[0])+'.</h1><p class="sub">One less thing to think about today.</p><div class="card punch"><span class="pill '+(on?'':'off')+'">'+(on?'● CURRENTLY CLOCKED IN':'● CURRENTLY CLOCKED OUT')+'</span><div id="timer" class="clock">00:00:00</div><div class="muted">'+(s.lastPunch?(on?'Clocked in at ':'Clocked out at ')+fmt(s.lastPunch.at):'Ready for your first punch')+'</div><div class="actions"><button id="in" class="action '+(on?'':'active')+'" '+(on?'disabled':'')+'>↓ Clock In</button><button id="out" class="action '+(on?'active':'')+'" '+(on?'':'disabled')+'>↑ Clock Out</button></div></div><h3 class="section">This week</h3><div class="stats"><div class="card stat"><div class="label">Worked hours</div><div class="value">'+fixed(s.totals.workedHours)+'</div></div><div class="card stat"><div class="label">Approved PTO</div><div class="value">'+fixed(s.ptoHours)+'</div></div></div><h3 class="section">Quick actions</h3><div class="card" style="padding:0;overflow:hidden"><button id="pto" class="link">▦ Request time off<small>Current payroll week</small></button><button id="history" class="link">≡ View my timecard<small>Punches and daily hours</small></button></div>';$('in').onclick=()=>punch('IN');$('out').onclick=()=>punch('OUT');$('pto').onclick=pto;$('history').onclick=history;elapsed();interval=setInterval(elapsed,1000)}
async function load(){try{state=await api('state');render()}catch(e){signin();if(!/sign in/i.test(e.message))toast(e.message)}}
async function punch(kind){const button=$(kind==='IN'?'in':'out');button.disabled=true;try{await api('punch',{kind});await load();toast(kind==='IN'?'Clocked in':'Clocked out')}catch(e){button.disabled=false;toast(e.message)}}
function pto(){const s=state;modal('<h2>Request time off</h2><p class="sub">For your current pay period.</p><form id="ptoform"><label class="field">Date</label><input class="input" type="date" id="date" min="'+s.monday+'" max="'+s.sunday+'" value="'+s.today+'" required><label class="field">Hours</label><select class="input" id="hours">'+Array.from({length:48},(_,i)=>'<option value="'+((i+1)/4)+'" '+(i===31?'selected':'')+'>'+fixed((i+1)/4)+' hours</option>').join('')+'</select><button class="primary">Submit request</button></form><div class="info">Requests remain pending until reviewed.</div>');$('ptoform').onsubmit=async e=>{e.preventDefault();try{await api('pto',{date:$('date').value,hours:Number($('hours').value)});close();await load();toast('PTO requested')}catch(e){toast(e.message)}}}
function history(){const s=state,t=s.totals;modal('<h2>My timecard</h2><p class="sub">'+day(s.monday)+' – '+day(s.sunday)+'</p><div class="info">Weekly total is rounded once to the nearest quarter-hour. First completed break receives a 30-minute lunch credit.</div><div class="row"><b>Regular</b><b>'+fixed(t.regularHours)+'</b></div><div class="row"><b>Overtime</b><b>'+fixed(t.overtimeHours)+'</b></div>'+t.days.map(d=>'<div class="row"><b>'+day(d.date)+(d.needsReview?' ⚠':'')+'</b><b>'+fixed(d.minutes/60)+' hrs</b></div>'+d.punches.map(p=>'<div class="row"><span class="muted">'+p.kind+'</span><span>'+fmt(p.at)+'</span></div>').join('')).join('')+'<h3>PTO requests</h3>'+s.requests.map(r=>'<div class="row"><span>'+day(r.date)+' · '+fixed(r.hours)+'</span><b>'+escapeHTML(r.status)+'</b></div>').join('')+'<div class="info">Need a correction? Please contact the office.</div>')}
$('signout').onclick=async()=>{try{await api('logout',{});signin()}catch(e){toast(e.message)}};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
