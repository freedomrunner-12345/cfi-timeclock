<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b81025"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CFI Time"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png"><title>CFI Time Clock</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f9;color:#202127;font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}main{max-width:540px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;letter-spacing:-.06em;font-weight:800}.logo{background:#b81025;color:white;border-radius:14px;width:46px;height:46px;display:grid;place-items:center;font-size:26px}.grey{color:#9798a2}.eyebrow{font-size:15px;font-weight:800;letter-spacing:.06em;color:#878893}.hello{font-size:33px;letter-spacing:-.06em;margin:10px 0}.sub{font-size:17px;color:#767883;line-height:1.5}.card{background:#fff;border:1px solid #eeeef1;border-radius:24px;padding:22px;box-shadow:0 8px 25px #22222205;margin-top:23px}.punch{text-align:center;padding:28px 22px 22px}.pill{display:inline-block;font-size:14px;border-radius:20px;padding:9px 14px;background:#e9f7f0;color:#238259;font-weight:800}.pill.off{background:#f1f1f4;color:#7c7e87}.clock{font-size:54px;letter-spacing:-.08em;font-weight:750;font-variant-numeric:tabular-nums;margin:22px 0 3px}.actions,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}button{font:inherit;cursor:pointer}button:disabled{opacity:.35}.action{border:0;border-radius:16px;padding:24px 9px;font-weight:750;font-size:19px;background:#f0f0f3;color:#696974}.action.active,.primary{color:white;background:#b81025}.primary{border:0;border-radius:14px;padding:18px;width:100%;font-weight:750;font-size:18px}.stat{padding:20px}.label{color:#767882;font-size:16px}.value{font-size:30px;font-weight:750;letter-spacing:-.05em;margin-top:8px}.section{font-size:18px;letter-spacing:-.04em;margin:28px 0 12px}.link{border:0;width:100%;padding:21px;background:white;text-align:left;font-weight:700;font-size:18px;color:#2c2c32}.link+.link{border-top:1px solid #f0f0f2}.link small{display:block;color:#858792;font-size:15px;font-weight:400;margin-top:5px}.input{width:100%;margin:8px 0 18px;padding:16px;border-radius:14px;background:#fafafa;border:1px solid #e5e5e8;font:inherit;font-size:18px}.field{font-size:16px;font-weight:750;color:#666}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:3;background:#15151c88;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:white;border-radius:25px;padding:24px;width:100%;max-width:500px;max-height:89vh;overflow:auto}.row{padding:15px 0;border-bottom:1px solid #ededf0;display:flex;justify-content:space-between;gap:16px;font-size:16px}.muted{font-size:15px;color:#858691}.info{background:#f7f7f8;color:#747680;padding:14px;border-radius:12px;margin:16px 0;font-size:15px;line-height:1.5}.close{float:right;border:0;background:#f1f1f4;border-radius:10px;padding:8px 12px;color:#666}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2b34;color:white;padding:14px;border-radius:12px;font-size:16px;max-width:90vw}@media(min-width:700px){.overlay{align-items:center}}

main{text-align:center;max-width:520px;padding:20px 18px 60px}.top{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:29px}.brand{width:min(100%,345px);background:#18191d;border-radius:21px;padding:15px 19px;justify-content:center;box-shadow:0 9px 26px #1111}.real-logo{width:100%;max-width:280px;display:block;object-fit:contain}#signout{font-size:15px;padding:11px 16px}.eyebrow,.hello,.sub,.section,.label,.muted,.link,.row{text-align:center}.hello{font-size:clamp(29px,7vw,37px);line-height:1.17;margin:10px 0}.sub{font-size:17px}.punch{padding:30px 19px}.pill{font-size:15px;letter-spacing:.01em}.actions{display:block;margin-top:27px}.action{display:block;width:100%;font-size:23px;min-height:76px;padding:19px}.action.active{background:#b81025;box-shadow:0 10px 25px #b8102530}.action:disabled{display:none}.primary{background:#b81025}.today-title{font-size:21px;margin:28px 0 11px;font-weight:800;letter-spacing:-.05em}.today-card{padding:7px 20px}.punch-entry{border-bottom:1px solid #f0f0f2;display:flex;align-items:center;justify-content:center;gap:14px;padding:15px 0;font-size:17px}.punch-entry:last-child{border:0}.punch-time{font-variant-numeric:tabular-nums;font-weight:800}.punch-label{color:#70717c}.entry-dot{width:10px;height:10px;background:#18a46a;border-radius:50%;flex-shrink:0}.entry-dot.out{background:#b8b8c1}.empty{padding:22px 2px;font-size:16px;color:#868792;line-height:1.5}.link{text-align:center;display:block;padding:20px}.link small{font-size:15px}.success-layer{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:#f7f7f9ed;backdrop-filter:blur(9px);animation:fade .22s ease-out}.success-card{max-width:430px;width:100%;border-radius:29px;padding:38px 24px;background:white;border:1px solid #eeeef0;box-shadow:0 20px 70px #1b1b2521;text-align:center}.success-check{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:#eaf9ef;color:#178858;animation:pop .45s cubic-bezier(.2,1.5,.3,1)}.success-check svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.success-title{font-size:31px;line-height:1.17;font-weight:800;letter-spacing:-.055em}.success-sub{font-size:18px;color:#767784;line-height:1.5;margin:13px 0 24px}.success-done{background:#b81025;color:white;border:0;border-radius:15px;min-height:54px;width:100%;font-size:18px;font-weight:800}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.6)}75%{transform:scale(1.06)}to{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.success-layer,.success-check{animation:none}}

/* Keep the authentic round tire emblem; do not frame the logo in a black box. */
.top{margin-bottom:26px}
.brand{background:transparent!important;box-shadow:none!important;border-radius:0!important;padding:0!important;width:100%!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.emblem-crop{position:relative;display:block;width:140px;height:140px;overflow:hidden;border-radius:50%;flex-shrink:0}
.emblem-crop .real-logo{position:absolute;display:block;width:386px!important;max-width:none!important;height:139px!important;left:-43px;top:0;object-fit:initial}
.brand-title{font-size:18px;font-weight:800;letter-spacing:-.035em;color:#24242c}
@media(max-width:400px){.brand{max-width:none!important;padding:0!important}}

#signout{display:block!important;margin:12px auto 0!important;min-height:54px!important;min-width:190px!important;border-radius:15px!important;font-size:19px!important;font-weight:750!important;background:#ffffff!important;color:#b81025!important;border:2px solid #b81025!important;box-shadow:0 3px 14px #201c200b}
#signout.hidden{display:none!important}
.inactivity-label{margin-top:7px;text-align:center;font-size:14px;color:#777986;font-variant-numeric:tabular-nums;font-weight:600}
.today-card .row{text-align:center;align-items:center}
.modal .section{text-align:center;margin:22px 0 8px}
.modal .row{font-size:17px}

/* Shared-device readability adjustments */
#login .input{text-align:center;font-variant-numeric:tabular-nums}
#login .input::placeholder{text-align:center}
.inactivity-label .countdown-number{color:#b81025;font-weight:800;font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Minimal centered employee experience */
main.login-mode{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
.login-mode .top{margin:0 0 24px;min-height:0}
.login-mode .brand{gap:0}
.login-mode #app{width:100%}
.login-mode .signin-card{margin-top:0;padding:30px 24px}
.login-mode .signin-card h2{margin:6px 0 24px;font-size:24px}
.signed-in-mode .brand{display:none!important}
.signed-in-mode .top{margin:0 0 22px;min-height:0;gap:7px}
.signed-in-mode{padding-top:max(20px,env(safe-area-inset-top))}
.signed-in-mode{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-bottom:max(30px,env(safe-area-inset-bottom))}
.signed-in-mode #app{width:100%}
@media(max-height:900px){.signed-in-mode{justify-content:flex-start}}
.signed-in-mode .hello{margin:10px 0 24px}
.option-actions{display:grid;grid-template-columns:1fr;gap:13px;margin:0}
.option-button{display:block;width:100%;min-height:84px;background:#faeff1!important;border:1.5px solid #e9bfc6!important;border-radius:18px!important;box-shadow:0 4px 12px #5113240d;color:#832034!important;text-align:center;transition:background .15s ease,transform .15s ease}
.option-button small{color:#806c73!important}
.option-button:active{background:#f3dfe3!important;transform:scale(.99)}
.option-button:focus-visible{outline:3px solid #b81025;outline-offset:3px}
@media(min-width:700px){main.login-mode{min-height:100vh}}
@media(max-height:700px){main.login-mode{justify-content:flex-start;padding-top:25px}.login-mode .top{margin-bottom:20px}}
</style></head><body><main class="login-mode"><header class="top"><div class="brand"><span class="emblem-crop"><img src="/cfi-logo.png" alt="CFI Tire Service" class="real-logo"></span></div><button id="signout" class="close hidden">Sign Out</button><div id="inactivity" class="inactivity-label hidden" aria-live="off">Automatic Sign Out In 1:00</div></header><div id="app"></div></main><div class="overlay hidden" id="overlay"></div><div class="toast hidden" id="toast"></div><script>
const $=s=>document.getElementById(s),escapeHTML=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fixed=n=>Number(n).toFixed(2),fmt=t=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'}).format(new Date(t)),day=d=>new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
let state=null,interval=null;
let lastActivity=Date.now(), countdownTimer=null,lastPing=0,signingOut=false;
const TIMEOUT_MS=60000;
function updateCountdown(){
 if(!state)return;
 const remaining=Math.max(0,Math.ceil((TIMEOUT_MS-(Date.now()-lastActivity))/1000));
 const target=$('inactivity');
 if(target){target.classList.remove('hidden');const time=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');target.innerHTML='Automatic Sign Out In <span class="countdown-number">'+time+'</span>';}
 if(remaining<=0){signOut(true);}
}
function stopCountdown(){clearInterval(countdownTimer);countdownTimer=null;$('inactivity')?.classList.add('hidden');}
function startCountdown(){lastActivity=Date.now();clearInterval(countdownTimer);countdownTimer=setInterval(updateCountdown,1000);updateCountdown();}
function interaction(){
 if(!state||signingOut)return;
 if(Date.now()-lastActivity>=TIMEOUT_MS){signOut(true);return;}
 lastActivity=Date.now();updateCountdown();
 if(Date.now()-lastPing>10000){
   lastPing=Date.now();
   api('activity',{}).catch(err=>{if(/sign in/i.test(err.message))signOut(true)});
 }
}
async function signOut(expired=false){
 if(signingOut)return;
 signingOut=true;stopCountdown();
 state=null;
 document.getElementById('success-layer')?.remove();
 close();
 try{await api('logout',{})}catch(e){}
 finally{signingOut=false;window.location.reload();}
}
for(const eventName of ['pointerdown','keydown','touchstart','wheel']){
 document.addEventListener(eventName,interaction,{passive:true});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state){if(Date.now()-lastActivity>=TIMEOUT_MS)signOut(true);else updateCountdown();}});
window.addEventListener('pageshow',()=>{if(state&&Date.now()-lastActivity>=TIMEOUT_MS)signOut(true)});

async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',credentials:'same-origin',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function modal(s){$('overlay').innerHTML='<div class="modal"><button id="close" class="close">×</button>'+s+'</div>';$('overlay').classList.remove('hidden');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()}}
function close(){$('overlay').classList.add('hidden')}
function signin(){document.querySelector('main').classList.add('login-mode');document.querySelector('main').classList.remove('signed-in-mode');clearInterval(interval);stopCountdown();state=null;$('signout').classList.add('hidden');$('app').innerHTML='<div class="card signin-card"><h2>Employee Sign In</h2><form id="login"><label class="field visually-hidden" for="id">Paychex Employee ID</label><input class="input" name="id" id="id" inputmode="numeric" required placeholder="Enter Paychex Employee ID"><button class="primary">Sign In</button></form><p class="muted">You Will Be Signed Out After 1 Minute Of Inactivity.</p></div>';$('login').onsubmit=async e=>{e.preventDefault();try{await api('login',{id:$('id').value});await load()}catch(e){toast(e.message)}}}

function firstName(name){const n=String(name||'').trim();return n.includes(',')?(n.split(',')[1]?.trim().split(/\s+/)[0]||'there'):(n.split(/\s+/)[0]||'there')}
function punchesToday(s){return s.totals.days.find(d=>d.date===s.today)?.punches||[]}
function render(){
 document.querySelector('main').classList.remove('login-mode');document.querySelector('main').classList.add('signed-in-mode');
 $('signout').classList.remove('hidden');
 const s=state,first=escapeHTML((s.user.preferredName || firstName(s.user.name))),on=s.isClockedIn,entries=punchesToday(s);
 const list=entries.map(p=>'<div class="punch-entry"><i class="entry-dot '+(p.kind==='OUT'?'out':'')+'"></i><span class="punch-label">'+(p.kind==='IN'?'Clocked in':'Clocked out')+'</span><span class="punch-time">'+fmt(p.at)+'</span></div>').join('');
 $('app').innerHTML='<div class="eyebrow">'+day(s.today).toUpperCase()+'</div><h1 class="hello">'+first+'</h1><div class="card punch"><span class="pill '+(on?'':'off')+'">'+(on?'● CURRENTLY CLOCKED IN':'● CURRENTLY CLOCKED OUT')+'</span><div class="actions"><button class="action active" id="punch">'+(on?'↑ Clock Out':'↓ Clock In')+'</button></div></div><h2 class="today-title">Today’s Punches</h2><div class="card today-card">'+(list||'<div class="empty">No Punches Recorded Today.</div>')+'</div><h2 class="section">More Options</h2><div class="option-actions"><button class="link option-button" id="pto">Request Time Off<small>Current Payroll Week</small></button><button class="link option-button" id="history">View My Timecard<small>Daily Clock In And Clock Out Times</small></button></div>';
 $('punch').onclick=()=>punch(on?'OUT':'IN');$('pto').onclick=pto;$('history').onclick=history;
}
function showSuccess(kind,isFirst,at){
 document.getElementById('success-layer')?.remove();
 const first=escapeHTML((state.user.preferredName || firstName(state.user.name)));
 const title=kind==='OUT'?'Clock Out Successful':kind==='IN'?'Clock In Successful':'Punch Recorded';
 const message=kind==='OUT'?'Recorded At '+fmt(at):isFirst?'Have A Great Day, '+first+'!':'Recorded At '+fmt(at);
 const layer=document.createElement('div');layer.id='success-layer';layer.className='success-layer';layer.setAttribute('role','status');
 layer.innerHTML='<div class="success-card"><div class="success-check"><svg viewBox="0 0 60 60"><path d="M12 31l12 12 25-27"/></svg></div><div class="success-title">'+title+'</div><div class="success-sub">'+message+'</div><button id="success-done" class="success-done">Done</button></div>';
 document.body.appendChild(layer);document.getElementById('success-done').onclick=()=>layer.remove();
}
async function load(){try{state=await api('state');render();startCountdown()}catch(e){signin();if(!/sign in/i.test(e.message))toast(e.message)}}
async function punch(kind){const button=$('punch');button.disabled=true;const first=kind==='IN'&&!punchesToday(state).some(p=>p.kind==='IN');try{const reply=await api('punch',{kind});await load();showSuccess(kind,first,reply.at)}catch(err){button.disabled=false;toast(err.message)}}
function pto(){const s=state;modal('<h2>Request time off</h2><p class="sub">For your current pay period.</p><form id="ptoform"><label class="field">Date</label><input class="input" type="date" id="date" min="'+s.monday+'" max="'+s.sunday+'" value="'+s.today+'" required><label class="field">Hours</label><select class="input" id="hours">'+Array.from({length:48},(_,i)=>'<option value="'+((i+1)/4)+'" '+(i===31?'selected':'')+'>'+fixed((i+1)/4)+' hours</option>').join('')+'</select><button class="primary">Submit request</button></form><div class="info">Requests remain pending until reviewed.</div>');$('ptoform').onsubmit=async e=>{e.preventDefault();try{await api('pto',{date:$('date').value,hours:Number($('hours').value)});close();await load();toast('PTO requested')}catch(e){toast(e.message)}}}
function history(){
 const s=state;
 const dates=s.totals.days.filter(d=>d.punches.length);
 const lines=dates.length?dates.map(d=>'<h3 class="section">'+day(d.date)+'</h3>'+d.punches.map(p=>'<div class="row"><span>'+(p.kind==='IN'?'Clock In':'Clock Out')+'</span><strong>'+fmt(p.at)+'</strong></div>').join('')).join(''):'<div class="info">No Punches Recorded This Week.</div>';
 modal('<h2>My Timecard</h2><p class="sub">'+day(s.monday)+' – '+day(s.sunday)+'</p>'+lines);
}
$('signout').onclick=()=>signOut(false);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
