function punchesToday(s){return s.totals.days.find(d=>d.date===s.today)?.punches||[]}
function render(){
 setAppTheme('#f7f7f9');
 preserveSessionControls();
 const main=document.querySelector('main');
 clearKeypadIdle();
 main.classList.remove('login-mode','welcome-mode');
 main.classList.add('signed-in-mode');
 $('signout').classList.remove('hidden');
 $('sessionControls').classList.remove('hidden');
 const s=state,first=escapeHTML((s.user.preferredName||firstName(s.user.name))),on=s.isClockedIn;
 const entries=punchesToday(s);
 const last=entries.length?entries[entries.length-1]:null;
 const list=entries.map(p=>'<div class="punch-entry"><i class="entry-dot '+(p.kind==='OUT'?'out':'')+'"></i><span class="punch-label">'+(p.kind==='IN'?'In':'Out')+'</span><span class="punch-time">'+fmt(p.at)+'</span></div>').join('');
 $('app').innerHTML='<div class="clock-home">'
  +'<header class="employee-greeting"><div class="eyebrow">'+day(s.today).toUpperCase()+'</div><h1 class="hello">Welcome Back, '+first+'.</h1></header>'
  +'<section class="primary-zone" aria-label="Clock Status"><div class="status-line"><span class="entry-dot '+(on?'':'out')+'"></span>'+(on?'Currently Clocked In':'Currently Clocked Out')+'</div>'
  +'<button class="main-clock-button" id="punch" type="button"><span class="clock-arrow" aria-hidden="true">'+(on?'↑':'↓')+'</span>Clock '+(on?'Out':'In')+'</button>'
  +(last?'<div class="last-punch">Last '+(last.kind==='IN'?'In':'Out')+' · '+fmt(last.at)+'</div>':'')+'</section>'
  +'<section class="daily-section" aria-label="Today’s Punches"><h2 class="quiet-heading">Today’s Punches</h2>'
  +(list?'<div class="compact-punches">'+list+'</div>':'<div class="empty">No Punches Yet</div>')+'</section>'
  +'<div class="option-actions" aria-label="More Actions">'
  +'<button class="option-button" id="pto" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>Request Time Off</span></button>'
  +'<button class="option-button" id="history" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>My Timecard</span></button>'
  +'</div><div class="questions-clock">'+questionsLink()+'</div></div>';
 $('app').appendChild($('sessionControls'));
 $('punch').onclick=()=>punch(on?'OUT':'IN');
 $('pto').onclick=pto;
 $('history').onclick=history;
 wireQuestions();
}
function showSuccess(kind,isFirst,at){
 document.getElementById('success-layer')?.remove();
 const first=escapeHTML((state.user.preferredName || firstName(state.user.name)));
 const title=kind==='OUT'?'Clock Out Successful':kind==='IN'?'Clock In Successful':'Punch Recorded';
 const message=kind==='OUT'?'Recorded At '+fmt(at):isFirst?'Have A Great Day, '+first+'!':'Recorded At '+fmt(at);
 const layer=document.createElement('div');layer.id='success-layer';layer.className='success-layer';layer.setAttribute('role','status');
 layer.innerHTML='<div class="success-card"><div class="success-check"><svg viewBox="0 0 60 60"><path d="M12 31l12 12 25-27"/></svg></div><div class="success-title">'+title+'</div><div class="success-sub">'+message+'</div><button id="success-done" class="success-done">Done</button></div>';
 document.body.appendChild(layer);document.getElementById('success-done').onclick=()=>layer.remove();
}
async function load(fromSignin=false){try{state=await api('state');if(fromSignin)showClockAfterSignin();else{render();startCountdown()}}catch(e){welcome();if(!/sign in/i.test(e.message))toast(e.message)}}
// Distinct, locally synthesized confirmation chimes; no external sound dependencies.
let punchAudio=null;
function unlockPunchAudio(){
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!punchAudio)punchAudio=new AudioContextClass();
  if(punchAudio.state==='suspended')punchAudio.resume().catch(()=>{});
 }catch(e){/* Sound must never prevent a punch. */}
}
function playPunchSound(kind){
 try{
  const ctx=punchAudio;
  if(!ctx||ctx.state!=='running')return;
  const now=ctx.currentTime+0.015;
  // A rising two-note chime for IN, a descending pair for OUT.
  const notes=kind==='IN'?[659.25,880]:[587.33,440];
  const peak=kind==='IN'?0.115:0.095;
  notes.forEach((frequency,i)=>{
   const start=now+i*0.135;
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type='sine';
   osc.frequency.setValueAtTime(frequency,start);
   gain.gain.setValueAtTime(0.0001,start);
   gain.gain.exponentialRampToValueAtTime(peak*(i===1?0.82:1),start+0.012);
   gain.gain.exponentialRampToValueAtTime(0.0001,start+0.24);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(start);osc.stop(start+0.26);
   osc.onended=()=>{osc.disconnect();gain.disconnect()};
  });
 }catch(e){/* Audio is optional feedback, never a prerequisite. */}
}
async function punch(kind){
 const button=$('punch');
 button.disabled=true;
 // Unlock audio synchronously in the user's tap gesture (mobile browser requirement).
 unlockPunchAudio();
 const first=kind==='IN'&&!punchesToday(state).some(p=>p.kind==='IN');
 let saved=false;
 try{
  const reply=await api('punch',{kind});
  saved=true;
  playPunchSound(kind);
  await load();
  showSuccess(kind,first,reply.at);
 }catch(err){
  if(!saved){button.disabled=false;toast(err.message)}
  else toast('Punch saved. Please refresh if the screen does not update.');
 }
}
function pto(){const s=state;modal('<h2>Request time off</h2><p class="sub">For your current pay period.</p><form id="ptoform"><label class="field">Date</label><input class="input" type="date" id="date" min="'+s.monday+'" max="'+s.sunday+'" value="'+s.today+'" required><label class="field">Hours</label><select class="input" id="hours">'+Array.from({length:48},(_,i)=>'<option value="'+((i+1)/4)+'" '+(i===31?'selected':'')+'>'+fixed((i+1)/4)+' hours</option>').join('')+'</select><button class="primary">Submit request</button></form><div class="info">Requests remain pending until reviewed.</div>');$('ptoform').onsubmit=async e=>{e.preventDefault();try{await api('pto',{date:$('date').value,hours:Number($('hours').value)});close();await load();toast('PTO requested')}catch(e){toast(e.message)}}}
function history(){
 const s=state;
 const dates=s.totals.days.filter(d=>d.punches.length);
 const lines=dates.length?dates.map(d=>'<h3 class="section">'+day(d.date)+'</h3>'+d.punches.map(p=>'<div class="row"><span>'+(p.kind==='IN'?'Clock In':'Clock Out')+'</span><strong>'+fmt(p.at)+'</strong></div>').join('')).join(''):'<div class="info">No Punches Recorded This Week.</div>';
 modal('<h2>My Timecard</h2><p class="sub">'+day(s.monday)+' – '+day(s.sunday)+'</p>'+lines);
}
$('signout').onclick=()=>signOut(false);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
