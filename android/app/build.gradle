plugins { id 'com.android.application' }

android {
    namespace 'com.cfitire.timeclock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cfitire.timeclock'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '' }
    }
}
